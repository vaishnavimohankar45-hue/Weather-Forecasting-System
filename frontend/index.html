<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        WeatherWise | Smart Weather Forecasting System
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="default">


<div class="app">


    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-logo">
                ☁
            </div>

            <h1>
                WeatherWise
            </h1>

            <p>
                Smart Weather Forecasting System
            </p>

        </div>


        <nav class="nav">

            <!-- HOME -->

            <a
                href="#home"
                class="nav-item active"
            >

                <span class="nav-icon">
                    🏠
                </span>

                <span>
                    Home
                </span>

            </a>


            <!-- FORECAST -->

            <a
                href="#forecast"
                class="nav-item"
            >

                <span class="nav-icon">
                    ◉
                </span>

                <span>
                    Forecast
                </span>

            </a>


            <!-- ALERTS -->

            <a
                href="#alerts"
                class="nav-item"
            >

                <span class="nav-icon">
                    🔔
                </span>

                <span>
                    Alerts
                </span>

            </a>


        </nav>

    </aside>



    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main class="main">


        <!-- =================================================
             TOP BAR
             ================================================= -->

        <header class="topbar">


            <!-- SEARCH -->

            <form
                class="search-box"
                id="searchForm"
            >

                <input
                    type="text"
                    id="locationInput"
                    placeholder="Search city, town or village..."
                    autocomplete="off"
                >


                <button
                    type="button"
                    id="searchBtn"
                >
                    ⌕
                </button>

            </form>



            <!-- CURRENT LOCATION -->

            <button
                class="location-button"
                onclick="useMyLocation()"
            >

                📍
                Use My Location

            </button>



            <!-- PROFILE -->

            <div class="profile">
                ●
            </div>


        </header>



        <!-- =================================================
             CONTENT
             ================================================= -->

        <section class="content">


            <!-- ERROR MESSAGE -->

            <div
                id="errorMessage"
                class="error-message"
            ></div>



            <!-- =================================================
                 CURRENT WEATHER
                 ================================================= -->

            <section
                class="current-card"
                id="home"
            >


                <div class="current-left">


                    <!-- LOCATION -->

                    <div class="place">

                        <span class="place-icon">
                            📍
                        </span>


                        <div>

                            <h2 id="locationName">
                                Loading...
                            </h2>


                            <small id="currentDate">
                                Loading...
                            </small>

                        </div>

                    </div>



                    <!-- CURRENT WEATHER -->

                    <div class="current-weather">


                        <div
                            class="weather-icon"
                            id="weatherIcon"
                        >
                            🌤️
                        </div>


                        <div
                            class="temperature"
                            id="temperature"
                        >
                            --°C
                        </div>


                        <div class="condition">

                            <strong id="weatherCondition">
                                Loading...
                            </strong>


                            <small id="feelsLike">
                                Feels like --°C
                            </small>

                        </div>


                    </div>


                </div>



                <!-- =================================================
                     WEATHER STATS
                     ================================================= -->

                <div class="weather-stats">


                    <!-- HUMIDITY -->

                    <div class="stat">

                        <span class="stat-icon">
                            💧
                        </span>

                        <span class="stat-label">
                            Humidity
                        </span>

                        <b
                            class="stat-value"
                            id="humidity"
                        >
                            --
                        </b>

                    </div>



                    <!-- WIND -->

                    <div class="stat">

                        <span class="stat-icon">
                            ♨
                        </span>

                        <span class="stat-label">
                            Wind Speed
                        </span>

                        <b
                            class="stat-value"
                            id="windSpeed"
                        >
                            --
                        </b>

                    </div>



                    <!-- RAINFALL -->

                    <div class="stat">

                        <span class="stat-icon">
                            ☔
                        </span>

                        <span class="stat-label">
                            Rainfall
                        </span>

                        <b
                            class="stat-value"
                            id="rainfall"
                        >
                            --
                        </b>

                    </div>



                    <!-- UV -->

                    <div class="stat">

                        <span class="stat-icon">
                            ☀
                        </span>

                        <span class="stat-label">
                            UV Index
                        </span>

                        <b
                            class="stat-value"
                            id="uvIndex"
                        >
                            --
                        </b>

                    </div>


                </div>


            </section>



            <!-- =================================================
                 HOURLY FORECAST
                 ================================================= -->

            <section
                class="panel"
                id="forecast"
            >


                <div class="section-header">


                    <h3>
                        Hourly Forecast
                    </h3>
                    <div>
<button type="button" id="nextHoursBtn" class="arrow-button"
        title="Next 6 Hours" aria-label="Next 6 Hours">
    <svg class="double-arrow" viewBox="0 0 48 36" aria-hidden="true">
        <path d="M3 3 L17 18 L3 33 L12 33 L26 18 L12 3 Z"
              fill="#00cfff" stroke="#8ff5ff" stroke-width="1"/>
        <path d="M20 3 L34 18 L20 33 L29 33 L43 18 L29 3 Z"
              fill="#00aeea" stroke="#8ff5ff" stroke-width="1"/>
    </svg>
</button>
<button type="button" id="currentHoursBtn" class="arrow-button"
        title="Back to Now" aria-label="Back to Now">
    <svg class="double-arrow back-arrow" viewBox="0 0 48 36" aria-hidden="true">
        <path d="M3 3 L17 18 L3 33 L12 33 L26 18 L12 3 Z"
              fill="#00cfff" stroke="#8ff5ff" stroke-width="1"/>
        <path d="M20 3 L34 18 L20 33 L29 33 L43 18 L29 3 Z"
              fill="#00aeea" stroke="#8ff5ff" stroke-width="1"/>
    </svg>
</button>
                </div>
</div>

                <div
                    class="hourly-grid"
                    id="hourlyContainer"
                >

                    <!-- JavaScript creates hourly cards -->

                </div>


            </section>



            <!-- =================================================
                 DAILY FORECAST
                 ================================================= -->

            <section
                class="panel"
                id="dailyForecast"
            >


                <div class="tabs">


                    <button
                        type="button"
                        class="tab active"
                        id="sevenDayTab"
                    >
                        7-Day Forecast
                    </button>


                    <button
                        type="button"
                        class="tab"
                        id="fifteenDayTab"
                    >
                        15-Day Forecast
                    </button>


                    <button
                        type="button"
                        class="view-15-button"
                        id="fullForecast"
                    >
                        View 15 Days →
                    </button>


                </div>


                <!-- 7 DAY FORECAST -->

                <div
                    class="daily-grid"
                    id="dailyContainer"
                >

                    <!-- JavaScript creates 7-day cards -->

                </div>


            </section>



            <!-- =================================================
                 15 DAY FORECAST
                 ================================================= -->

            <section
                class="panel"
                id="forecast15"
                hidden
            >


                <div class="section-header">


                    <h3>
                        15-Day Weather Forecast
                    </h3>


                    <button
                        type="button"
                        id="close15Day"
                    >
                        ← Back to 7 Days
                    </button>


                </div>


                <div
                    class="daily-grid"
                    id="forecast15Grid"
                >

                    <!-- JavaScript creates 15-day cards -->

                </div>


            </section>


                <!-- =================================================
                     WEATHER ALERT
                     ================================================= -->

                <div
                    class="info-card alert"
                    id="alerts"
                    tabindex="0"
                >


                    <div class="info-icon">
                        ⚠️
                    </div>


                    <div class="info-content">

                        <small id="alertTitle">
                            Weather Alert
                        </small>


                        <p id="alertMessage">
                            Loading weather alerts...
                        </p>

                    </div>


                    <span class="info-arrow">
                        ›
                    </span>


                </div>


            </section>


        </section>


    </main>


</div>
<script src="script.js"></script>
</body>

</html>
